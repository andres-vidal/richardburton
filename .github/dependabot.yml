# Dependency updates. See:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Packages that are released together and check each other's versions at
    # runtime have to move together: one pull request per family, not per
    # package. Storybook's addons name the core as a peer, so bumping one alone
    # leaves an install that resolves but does not work.
    #
    # Majors stay out of the groups and arrive on their own: a family's routine
    # updates should not wait on a major nobody is ready for, and a major the
    # toolchain cannot take yet should not hold a patch hostage.
    groups:
      storybook:
        patterns:
          - "storybook"
          - "@storybook/*"
        update-types: ["minor", "patch"]
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types: ["minor", "patch"]
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types: ["minor", "patch"]
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
        update-types: ["minor", "patch"]
      playwright:
        patterns:
          - "playwright"
          - "@playwright/*"
        update-types: ["minor", "patch"]
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "typescript-eslint"
        update-types: ["minor", "patch"]
    # The Node types describe the runtime this project pins, so their major is
    # not ours to choose: it follows `.tool-versions`, and a major ahead of it
    # would have the compiler accept APIs that do not exist when the code runs.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Elixir. The backend has its own lockfile and its own audit in CI, but nothing
  # was watching it — every dependency update here has been a manual sweep.
  - package-ecosystem: "mix"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      phoenix:
        patterns:
          - "phoenix"
          - "phoenix_*"
        update-types: ["minor", "patch"]
      ecto:
        patterns:
          - "ecto"
          - "ecto_*"
          - "postgrex"
        update-types: ["minor", "patch"]

  # The workflows pin their actions, and those pins go stale silently — checkout
  # is three majors behind.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
        update-types: ["minor", "patch"]
